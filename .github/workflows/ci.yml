# The CI of flowmark. Each step runs a target of the Makefile of this repository, whose recipes run the utilities of kit; the
# test discovery, execution and case-sensitive resources are kit's runner. The release takes the id of a successful push run of
# this workflow on main (release.yml, make release-tag); the run succeeds only when every job of it succeeds (T15-51).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The gates: the shared checks, and the lint of Go and of the TypeScript. The job installs
  # what they need (make gates-setup) and runs them past failures (make gates), which writes the report var/report/ci-targets;
  # the other jobs follow it.
  gates:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bootstrap the Node.js of mise.toml, npm and the packages of package-lock.json
        uses: ./.github/actions/bootstrap
      - name: install the tools and dependencies of the gates
        run: make gates-setup
      - name: gates
        run: make gates
      # actions/upload-artifact v7.0.1: the report of the gates.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gates-report
          path: var/report/ci-targets/
          if-no-files-found: ignore
  language:
    name: ${{ matrix.language }} (${{ matrix.os }})
    needs: gates
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        language: [typescript, go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Bootstrap the Node.js of mise.toml, npm and the packages of package-lock.json
        uses: ./.github/actions/bootstrap
      - name: install Go
        if: matrix.language == 'go'
        run: make install-tools TOOLS=go
      - name: install locked Go dependencies
        if: matrix.language == 'go'
        run: make deps-go
      - name: build and test the complete Go workspace offline
        if: matrix.language == 'go'
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
        run: make flowmark-go-check
      - name: test TypeScript infrastructure through Kit
        if: matrix.language == 'typescript'
        run: make flowmark-node-check
      - name: references
        if: matrix.language == 'typescript' && runner.os == 'Linux'
        run: make refs-check
  benchmarks:
    name: benchmarks (${{ matrix.os }})
    needs: gates
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Bootstrap the Node.js of mise.toml, npm and the packages of package-lock.json
        uses: ./.github/actions/bootstrap
      - name: install Go
        run: make install-tools TOOLS=go
      - name: install locked Go dependencies
        run: make deps-go
      - name: build the workspace offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
        run: make build-go
      - name: benchmarks through the Kit runner
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
        run: |
          # The open-file limit is a POSIX resource limit; Windows has none to raise (T15-39).
          if [ "$RUNNER_OS" != Windows ]; then
            ulimit -Sn; ulimit -Hn
            if [ "$RUNNER_OS" = macOS ]; then sudo sysctl -w kern.maxfiles=65536 kern.maxfilesperproc=65536; fi
            ulimit -n 65536
          fi
          make flowmark-benchmarks | tee benchmarks.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: benchmarks.txt
