# All test discovery, execution and case-sensitive resources belong to Kit.
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  language:
    name: ${{ matrix.language }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        language: [typescript, go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: bootstrap the locked Kit package
        run: npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
      - name: install pinned npm and Node
        run: make install-tools TOOLS=npm
      - name: install Go
        if: matrix.language == 'go'
        run: make install-tools TOOLS=go
      - name: install locked Go dependencies
        if: matrix.language == 'go'
        run: make flowmark-go-install
      - name: build and test the complete Go workspace offline
        if: matrix.language == 'go'
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
        run: make build-go test-go
      - name: test TypeScript infrastructure through Kit
        if: matrix.language == 'typescript'
        run: make test-infrastructure
      - name: references
        if: matrix.language == 'typescript' && runner.os == 'Linux'
        run: make refs-check
  benchmarks:
    name: benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: bootstrap the locked Kit package
        run: npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
      - name: install pinned npm and Node
        run: make install-tools TOOLS=npm
      - name: install Go
        run: make install-tools TOOLS=go
      - name: install locked Go dependencies
        run: make flowmark-go-install
      - name: build the workspace offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
        run: make build-go
      - name: benchmarks through the Kit runner
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
        run: |
          # The open-file limit is a POSIX resource limit; Windows has none to raise (T15-39).
          if [ "$RUNNER_OS" != Windows ]; then
            ulimit -Sn; ulimit -Hn
            if [ "$RUNNER_OS" = macOS ]; then sudo sysctl -w kern.maxfiles=65536 kern.maxfilesperproc=65536; fi
            ulimit -n 65536
          fi
          make flowmark-benchmarks | tee benchmarks.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: benchmarks.txt
  ci-passed:
    if: always()
    needs: [language, benchmarks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: bootstrap the locked Kit package
        run: npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
      - name: install pinned npm and Node
        run: make install-tools TOOLS=npm
      - name: require every mandatory job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-passed
