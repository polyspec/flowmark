# The tests of the repository on every platform it supports (T12.13): the platform-specific code of the lock, the
# journal, the watch and the file system runs only on its own platform, so the gate is a run on each.
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: install
        shell: bash
        run: make install
      # make flowmark-test runs the node tests, the Go tests of every Go module and, on macOS, the mount test of the
      # case-sensitive folder; the same make target runs on each platform of the matrix.
      - name: flowmark tests
        shell: bash
        run: make flowmark-test
      # The reference check of the documents: every task ID that a document names resolves to a checklist item.
      - name: references
        shell: bash
        run: make refs-check
      # The benchmarks of writepath, whose numbers the scale envelope of spec 40 states (T12.5-3, T12.13): one run
      # per platform, its output kept as an artifact of the run.
      - name: benchmarks
        shell: bash
        run: |
          # The watch of macOS holds one descriptor per document (spec 40), so the benchmark corpus needs more open
          # files than the runner's defaults allow. The standard raises are the rlimit and, on macOS, the per-process
          # file ceiling the kernel enforces beside it (kern.maxfilesperproc); each raise names its result in the
          # log, and a corpus that still does not fit fails the benchmark with the engine's DRIVER rule.
          ulimit -Sn; ulimit -Hn
          if [ "$(uname -s)" = Darwin ]; then sysctl kern.maxfilesperproc kern.maxfiles; fi
          if [ "$(uname -s)" = Darwin ]; then sudo sysctl -w kern.maxfiles=65536 || echo 'raise: kern.maxfiles refused'; fi
          if [ "$(uname -s)" = Darwin ]; then sudo sysctl -w kern.maxfilesperproc=65536 || echo 'raise: kern.maxfilesperproc refused'; fi
          ulimit -n 65536 || echo 'raise: the rlimit was refused'
          ulimit -Sn; ulimit -Hn
          (cd packages/go && go test ./writepath -run '^$' -bench . -benchmem) | tee benchmarks.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: benchmarks.txt
