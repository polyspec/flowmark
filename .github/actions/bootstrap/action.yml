# The bootstrap of every CI job of flowmark, which ci.yml and release.yml run after their checkout with
# `uses: ./.github/actions/bootstrap`. A job that needs PHP sets it up before.
name: bootstrap
description: Sets up the Node.js of mise.toml, installs the locked packages, then the npm of var/tools and the packages of package-lock.json with it.
runs:
  using: composite
  steps:
    # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap of kit, which installs that release into
    # var/tools with mise; the recipes then run the node of var/tools. The pinned npm of var/tools installs the packages, so the
    # cache of setup-node is off.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: mise.toml
        package-manager-cache: false
    # The Makefile runs the utilities of the installed kit package, so the locked packages are installed before make runs. npm 11
    # of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of devEngines runs
    # outside the checkout with --prefix; it reads the .npmrc of the checkout, which allows the URL of the kit release.
    - name: install the locked packages
      shell: bash
      run: |
        root="$PWD"
        version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
        (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts)
    # The mise, node and npm of mise.toml, then the packages of package-lock.json with that npm.
    - name: install npm
      shell: bash
      run: make install-tools TOOLS=npm
    - name: install packages
      shell: bash
      run: make install-packages
