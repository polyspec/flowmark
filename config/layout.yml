# The folder layout of flowmark (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml (a copy of
# kit) and the map of this repository. A rule named here replaces the field it names; each exception carries its reason.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: flowmark }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: flowmark }

  # S5: sidecar.json is the manifest that the soksak host reads from the root of the checkout (protocol v1), named by
  # sidecar.json and package.json. The other root files are those of the kit template.
  - extends_template: root-files
    id: layout-root-files
    vars: { root_files: "{sidecar.json}" }

  # K244: the Go suite of the conformance vectors crosses packages, so it lies in tests/conformance/go, a module of its own; the
  # vectors and catalogs that every runtime reads lie beside it in tests/conformance/. tests/kit holds the tests of kit.
  - id: layout-root-tests
    paths: ["tests/*", "!tests/kit", "!tests/conformance"]

  # S9: the infrastructure is TypeScript, and these files are the exceptions that the rule allows, each with its reason.
  - id: layout-infrastructure-typescript
    paths:
      - "scripts/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "tests/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      # The fixture checkouts of kit hold the packages of a consumer repository as test data, not infrastructure.
      - "!tests/kit/fixture/**"
      # S9: a harness that drives one language's implementation is a test of that language. go-test.mjs runs the go test of
      # each Go module, provisioning the case-sensitive folder that they need, and its test drives it.
      - "!scripts/go-test.mjs"
      - "!tests/go-test.test.mjs"
      # S9: the Go suites of the conformance vectors drive the Go implementation, so they are tests of that language.
      - "!tests/conformance/go/**"
      # S9: a symbol extractor runs that ecosystem's tool: record-slugs.mjs drives the heading renderers of GitHub, GitLab and
      # VS Code (gh, npm and cargo) to record the slug vectors, and its test drives the recorder without the network.
      - "!scripts/record-slugs.mjs"
      - "!tests/record-slugs.test.mjs"

  # S5: a path repository of a composer.json names a folder inside the repository. The board example runs against the sibling
  # checkouts of orm and hyper that its path repositories name, which lie outside this repository and are linked there by make link.
  - id: layout-composer-path
    select: ["**/composer.json", "!tests/kit/fixture/**", "!examples/board/web/composer.json"]
